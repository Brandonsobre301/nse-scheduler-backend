services:
  ai-service:
    build: ./ai-service
    # Port 8000 is NOT bound to the host — internal traffic only via app-net.
    # The Node.js backend reaches it at http://ai-service:8000
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - app-net
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo
      - ai-service
    networks:
      - app-net
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-net
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  app-net:
    external: true
    name: nse-app-net
