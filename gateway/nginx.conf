upstream backend_upstream {
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Auth routes - /api/ on the frontend maps to /auth/ on the backend
    location /api/ {
        proxy_pass http://backend_upstream/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Estimation engine routes - must be matched before /api/ (longer prefix wins)
    # and must NOT be rewritten, since Express mounts this router at /api/v1 directly.
    location /api/v1/ {
        proxy_pass        http://backend_upstream/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /projects/ {
        proxy_pass        http://backend_upstream/projects/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # React SPA - serve static build, fall back to index.html for client side routing
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri /index.html;
    }
}